version: "2"
linters:
  default: standard
  settings:
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Some error messages are complete sentences shown to the user.
        - -ST1005
        # Character whitelists read better without De Morgan rewriting.
        - -QF1001
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
